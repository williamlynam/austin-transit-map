; Austin Live Transit Map firmware (Live_Map_4layers rev A, ESP32-WROOM-32E, 4 MB)
;
; Build:          pio run
; Flash:          pio run -t upload
; Upload map:     pio run -t uploadfs      (writes data/ledmap.json; also wipes saved settings)
; Serial monitor: pio device monitor
; PC tests:       python test/host/run_tests.py

[platformio]
default_envs = transitmap

[env]
; pioarduino: Arduino core 3.x (ESP-IDF 5) for PlatformIO
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = esp32dev
framework = arduino
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; Registry packages download as small archives. (A git URL clones FastLED's
; whole history, hundreds of MB, which is very slow.)
lib_deps =
  fastled/FastLED@3.10.6
  bblanchon/ArduinoJson@7.4.3
build_flags =
  -DCORE_DEBUG_LEVEL=1
build_unflags = -std=gnu++11
build_src_flags = -Wall -Wextra -Wno-unused-parameter

[env:transitmap]

; Same firmware, but starts in simulated-feed mode on first boot (no Wi-Fi
; needed). Switch modes on the web page afterwards.
[env:transitmap_sim]
build_flags =
  ${env.build_flags}
  -DTRANSIT_DEFAULT_MODE=1

; Debug build: the setup hotspot turns on at boot and never turns off (MODE
; long press and Complete Setup leave it on). For release, build the normal
; transitmap env; nothing else needs changing.
[env:transitmap_debug]
build_flags =
  ${env.build_flags}
  -DHOTSPOT_ALWAYS_ON=1
