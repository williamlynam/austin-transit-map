# Builds the firmware and publishes a GitHub release when a version tag is
# pushed (git tag v0.1.16 && git push origin v0.1.16). The board's
# "Check now" / daily check reads the newest release and installs its
# transitmap-X-ota.bin. Tags with a "-" (v0.2.0-rc1) become pre-releases.
name: Release firmware

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches src/version.h
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver=$(sed -n 's/.*FIRMWARE_VERSION "\(.*\)".*/\1/p' src/version.h)
          echo "tag $tag, version.h $ver"
          test "$tag" = "$ver"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            firmware/.pio/libdeps
          key: pio-${{ hashFiles('firmware/platformio.ini') }}

      - name: Install PlatformIO
        run: pip install platformio

      - name: PC tests
        run: python test/host/run_tests.py

      - name: Build firmware and map image
        run: |
          pio run -e transitmap
          pio run -e transitmap -t buildfs

      - name: Collect files
        run: |
          v="${GITHUB_REF_NAME#v}"
          b=.pio/build/transitmap
          mkdir -p ../dist
          cp $b/firmware.bin ../dist/transitmap-$v-ota.bin
          cp $b/firmware.factory.bin ../dist/transitmap-$v-factory.bin
          cp $b/littlefs.bin ../dist/littlefs-map.bin
          ls -l ../dist

      - name: Publish release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""
          case "$GITHUB_REF_NAME" in *-*) pre="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --title "Firmware ${GITHUB_REF_NAME#v}" --generate-notes $pre
